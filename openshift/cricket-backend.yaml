# Weekend Cricket — database + API for OpenShift.
# Apply in the console: + (Quick create) → Import YAML → paste this whole file → Create.
# Prerequisite: the secret "cricket-secrets" (see HOW-TO-INSTALL.txt). It is NOT in this file
# on purpose, because this repo is public.
# After a sandbox renewal, change the Route host at the bottom to your new frontend address.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  labels: {app: postgresql, app.kubernetes.io/part-of: weekend-cricket}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels: {app: postgresql, app.kubernetes.io/part-of: weekend-cricket, app.openshift.io/runtime: postgresql}
spec:
  replicas: 1
  strategy: {type: Recreate}          # one pod at a time owns the volume
  selector:
    matchLabels: {app: postgresql}
  template:
    metadata:
      labels: {app: postgresql}
    spec:
      containers:
      - name: postgresql
        image: registry.redhat.io/rhel9/postgresql-16:latest
        ports:
        - {containerPort: 5432, name: postgresql}
        env:
        - {name: POSTGRESQL_USER, value: cricket}
        - {name: POSTGRESQL_DATABASE, value: cricket}
        - name: POSTGRESQL_PASSWORD
          valueFrom: {secretKeyRef: {name: cricket-secrets, key: DB_PASSWORD}}
        volumeMounts:
        - {name: data, mountPath: /var/lib/pgsql/data}
        readinessProbe:
          exec: {command: [/bin/sh, -c, "pg_isready -h 127.0.0.1 -p 5432 -U cricket -d cricket"]}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket: {port: 5432}
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
      volumes:
      - name: data
        persistentVolumeClaim: {claimName: postgresql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels: {app: postgresql, app.kubernetes.io/part-of: weekend-cricket}
spec:
  selector: {app: postgresql}
  ports:
  - {name: postgresql, port: 5432, targetPort: 5432}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: api
  labels: {app: api, app.kubernetes.io/part-of: weekend-cricket}
spec:
  lookupPolicy: {local: true}          # lets the Deployment use "api:latest" directly
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: api
  labels: {app: api, app.kubernetes.io/part-of: weekend-cricket}
spec:
  source:
    type: Git
    git: {uri: https://github.com/Nairsurajs/weekend-cricket, ref: main}
    contextDir: api
  strategy:
    type: Docker
    dockerStrategy: {dockerfilePath: Dockerfile}
  output:
    to: {kind: ImageStreamTag, name: "api:latest"}
  resources:
    limits: {cpu: "1", memory: 1Gi}
  triggers:
  - type: ConfigChange                  # builds once as soon as you create it
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {app: api, app.kubernetes.io/part-of: weekend-cricket, app.openshift.io/runtime: nodejs}
  annotations:
    app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"postgresql"}]'
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"api:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"api\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        image: api:latest
        ports:
        - {containerPort: 8080, name: http}
        env:
        - {name: DB_HOST, value: postgresql}
        - {name: DB_USER, value: cricket}
        - {name: DB_NAME, value: cricket}
        - name: DB_PASSWORD
          valueFrom: {secretKeyRef: {name: cricket-secrets, key: DB_PASSWORD}}
        - name: SCORER_PIN
          valueFrom: {secretKeyRef: {name: cricket-secrets, key: SCORER_PIN}}
        readinessProbe:                 # ready only when the database answers
          httpGet: {path: /api/readyz, port: 8080}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:                  # restart if the process stops answering
          httpGet: {path: /api/healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests: {cpu: 20m, memory: 64Mi}
          limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {app: api, app.kubernetes.io/part-of: weekend-cricket}
spec:
  selector: {app: api}
  ports:
  - {name: http, port: 8080, targetPort: 8080}
---
# Same address as the app, path /api → API. Keeps everything on one HTTPS link.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: api
  labels: {app: api, app.kubernetes.io/part-of: weekend-cricket}
spec:
  host: cricket-nairsurajs-dev.apps.rm1.0a51.p1.openshiftapps.com
  path: /api
  to: {kind: Service, name: api}
  port: {targetPort: http}
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
