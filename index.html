<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weekend Cricket Scorer</title>
<meta name="description" content="Ball-by-ball cricket scoring for weekend matches. Works offline.">
<meta name="theme-color" content="#0e4a31">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cricket Score">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a calm, quick scorer's tool you can use one-thumbed at the boundary rope
   IDEA: the ground's scoreboard on a mown outfield, with a scorer's keypad under it
   PICTURE: the live scoreboard band — striped grass, huge white score, ball-by-ball chips
   COLOUR and TYPE: outfield green dominant, chalk white support, cricket-ball red accent; Barlow Condensed numbers + Inter
   LAYOUT: one column, max 560px; board, batters/bowler, this over, keypad; scorecard on its own tab */
:root{color-scheme:light dark;--bg:light-dark(#f3f5f1,#0a130e);--card:light-dark(#fff,#122019);--ink:light-dark(#11211a,#e8f0eb);--mute:light-dark(#5b6b62,#9aaea2);--line:light-dark(#dfe5de,#22362a);--key:light-dark(#fff,#16271e);--g1:#0e4a31;--g2:#125a3c;--ball:#c8102e;--chalk:#f6f3ea}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f2b705;outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
html,body{overscroll-behavior-y:none}
button{user-select:none;-webkit-user-select:none;touch-action:manipulation}
.inst{min-height:38px;padding:0 12px;border-radius:999px;background:var(--ball);color:#fff;font-weight:700;font-size:14px}
.num,.big{font-family:"Barlow Condensed",Inter,sans-serif}
.top{display:flex;align-items:center;gap:8px;padding:10px 0}
.top h1{font:700 20px/1 "Barlow Condensed",sans-serif;margin:0;flex:1;letter-spacing:.01em}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{padding:8px 14px;border-radius:999px;font-size:14px;font-weight:600;min-height:38px;color:var(--mute)}
.tabs button.on{background:var(--g1);color:#fff}
.board{border-radius:18px;color:#fff;padding:16px 18px 14px;background:repeating-linear-gradient(90deg,var(--g1) 0 44px,var(--g2) 44px 88px);box-shadow:0 10px 24px -14px #0e4a31}
.board .meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;opacity:.9}
.board .team{font-weight:700;font-size:17px}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score .big{font-size:clamp(68px,20vw,104px);font-weight:700;line-height:.95}
.score .ov{font:600 26px "Barlow Condensed",sans-serif;opacity:.95}
.score .ov small{font-size:16px;opacity:.75}
.info{margin-top:6px;font-size:15px;background:rgba(0,0,0,.22);border-radius:10px;padding:7px 10px}
.fh{display:inline-block;background:var(--ball);color:#fff;font-weight:700;border-radius:6px;padding:2px 8px;font-size:13px;margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 32px 32px 50px;gap:4px;align-items:center;padding:6px 0;font-size:15px}
.row.h{font-size:12px;color:var(--mute);padding:0 0 2px}
.row>*:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.strk{color:var(--ball)}
.row.bw{grid-template-columns:minmax(0,1fr) 40px 36px 32px 34px 34px}
.sep{border-top:1px solid var(--line);margin-top:6px;padding-top:6px}
.exl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.exl div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px 4px;text-align:center;font-size:12px;color:var(--mute);line-height:1.2}
.exl b{display:block;font:700 22px/1.1 "Barlow Condensed",sans-serif;color:var(--ink)}
.exl .t{background:var(--g1);border-color:var(--g1);color:#d8eadf}.exl .t b{color:#fff}
.pteam{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg)}
.ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.ph span{font-size:13px;color:var(--mute)}
.prow{display:flex;gap:6px;align-items:center;margin-top:6px}
.prow .pn{flex:none;width:24px;text-align:right;font:600 16px "Barlow Condensed",sans-serif;color:var(--mute)}
.prow input{padding:9px 10px}
.prow .del{flex:none;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:22px;color:var(--mute)}
.prow input[readonly]{opacity:.7}
.addp{margin-top:8px;width:100%;min-height:44px;border-radius:10px;border:1px dashed var(--g2);color:var(--g2);font-weight:700;background:transparent}
:root[data-theme=dark] .addp{color:#7fc9a2;border-color:#7fc9a2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .addp{color:#7fc9a2;border-color:#7fc9a2}}
.part{font-size:13px;color:var(--mute);margin-top:4px}
.over{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.over .lbl{font-size:13px;color:var(--mute);margin-right:4px}
.chip{min-width:34px;height:34px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;font:600 16px "Barlow Condensed",sans-serif;background:var(--bg);border:1px solid var(--line)}
.chip.b{background:var(--g1);color:#fff;border-color:var(--g1)}
.chip.w{background:var(--ball);color:#fff;border-color:var(--ball)}
.chip.x{background:light-dark(#fff4d6,#3a2f10);border-color:light-dark(#f0d68a,#5c4a17)}
.pad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.pad button{min-height:68px;border-radius:14px;background:var(--key);border:1px solid var(--line);font:700 30px "Barlow Condensed",sans-serif;box-shadow:0 2px 0 var(--line)}
.pad button:active{transform:translateY(1px);box-shadow:none}
.pad .four,.pad .six{background:var(--g1);color:#fff;border-color:var(--g1)}
.pad .ex{font-size:21px;background:light-dark(#fff8e6,#2b2412)}
.pad .out{grid-column:span 2;background:var(--ball);color:#fff;border-color:var(--ball);font-size:26px}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.tools button{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.tools button:disabled{opacity:.4}
.panel{text-align:center;padding:22px 16px}
.panel h2{font:700 30px/1.1 "Barlow Condensed",sans-serif;margin:0 0 8px;text-wrap:balance}
.panel p{margin:0 0 14px;color:var(--mute)}
.primary{display:block;width:100%;min-height:54px;border-radius:14px;background:var(--g1);color:#fff;font-weight:700;font-size:17px;margin-top:10px}
.ghost{display:block;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);margin-top:8px;font-weight:600}
.danger{background:var(--ball)!important;color:#fff;border-color:var(--ball)!important}
/* setup */
.setup h2{font:700 34px/1.05 "Barlow Condensed",sans-serif;margin:6px 0 4px}
.setup .lead{color:var(--mute);margin:0 0 6px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 5px}
input,textarea{width:100%;font:16px Inter,sans-serif;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--key);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.hint{font-size:13px;color:var(--mute);font-weight:400}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--key);font-weight:600;padding:0 8px}
.seg button.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.seg-l{font-size:14px;font-weight:600;margin:12px 0 6px}
/* server features */
.top{flex-wrap:wrap}.top .tabs{order:3;width:100%}.top .tabs button{flex:1}
.sync{min-height:30px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--mute)}
.sync.ok{color:#137a45;border-color:#9fd8b8}.sync.warn{color:#8a5a00;border-color:#f0d68a}.sync.bad{color:var(--ball);border-color:var(--ball)}
.share{min-height:38px;padding:0 12px;border-radius:999px;background:var(--g1);color:#fff;font-weight:700;font-size:14px}
.livebadge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ball)}
.livebadge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ball);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}@media (prefers-reduced-motion:reduce){.livebadge::before{animation:none}}
.watchnote{font-size:13px;color:var(--mute);margin:8px 2px 0}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}.mrow small{display:block;color:var(--mute);font-size:13px}
.mrow a{min-height:40px;display:inline-grid;place-items:center;padding:0 14px;border-radius:10px;border:1px solid var(--line);color:inherit;text-decoration:none;font-weight:600}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--ball);color:#fff;vertical-align:middle}
.loadsq{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--g2);color:var(--g2);font-size:13px;font-weight:700;background:transparent}
.linkbox{word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;margin:6px 0 10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btnrow a,.btnrow button{min-height:48px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:inherit;text-decoration:none;background:var(--key)}
.msg{font-size:14px;margin:8px 0 0}.msg.bad{color:var(--ball)}.msg.ok{color:#137a45}
/* celebrations, memes, awards */
#fx{position:fixed;inset:0;z-index:20;display:none;place-items:center}
#fx.on{display:grid}
#fx .back{position:absolute;inset:0;background:rgba(4,22,13,.78);animation:fxfade .2s ease-out}
.fxbox{position:relative;text-align:center;color:#fff;padding:16px;width:min(94vw,440px)}
.fxword{font:400 clamp(76px,25vw,150px)/.92 Anton,Impact,"Barlow Condensed",sans-serif;letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.35);animation:fxpop .55s cubic-bezier(.2,1.6,.4,1) both}
.fx-six .fxword{color:#ffd23f}.fx-four .fxword{color:#7be0a5}.fx-out .fxword{color:#ff5a6a}.fx-win .fxword{color:#ffd23f;font-size:clamp(46px,14vw,84px);line-height:1}
.fxsub{font:700 19px/1.3 Inter,sans-serif;margin:10px 0 0;opacity:0;animation:fxfade .3s .35s forwards}
.fxart{display:block;width:230px;height:140px;margin:0 auto}
.fxart *{transform-box:fill-box}
.mtag{color:rgba(255,255,255,.65);font:600 12px Inter,sans-serif;margin-top:14px}
@keyframes fxpop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes fxfade{from{opacity:0}to{opacity:1}}
.ballfly{animation:fxfly 1.1s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes fxfly{0%{transform:translate(0,0) scale(.7)}100%{transform:translate(170px,-150px) scale(1.5);opacity:0}}
.streak{animation:fxstreak .8s cubic-bezier(.2,.8,.3,1) both}
@keyframes fxstreak{from{transform:translateX(-160px);opacity:0}to{transform:none;opacity:1}}
.stump{transform-origin:50% 100%;animation:fxtilt .5s .15s ease-out forwards}
@keyframes fxtilt{to{transform:rotate(var(--r))}}
.bail{transform-origin:50% 50%;animation:fxbail .9s .1s ease-out forwards}
@keyframes fxbail{to{transform:translate(var(--dx),-80px) rotate(var(--rot));opacity:.15}}
.fxtoast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;z-index:21;pointer-events:none;background:#1b2a22;color:#fff;font:700 18px/1 Inter,sans-serif;padding:12px 20px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.35);border:2px solid #f2b705;white-space:nowrap;animation:fxtoast 1.4s ease both}
@keyframes fxtoast{0%{opacity:0;transform:translate(-50%,-14px)}14%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.meme{position:relative;margin:0 auto;background:#111;border-radius:14px;overflow:hidden;width:min(90vw,400px);box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fxpop .45s cubic-bezier(.2,1.4,.4,1) both}
.meme svg{display:block;width:100%;height:auto}
.mcap{position:absolute;left:0;right:0;padding:8px 12px;text-align:center;color:#fff;text-transform:uppercase;font:400 clamp(22px,7vw,32px)/1.05 Anton,Impact,sans-serif;letter-spacing:.01em;text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000,0 3px 0 #000;text-wrap:balance}
.mcap.t{top:0}.mcap.b{bottom:0}
.confetti{position:fixed;top:-24px;z-index:22;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:fxfall linear forwards}
@keyframes fxfall{to{transform:translate(var(--sx),110vh) rotate(var(--sr))}}
.trophy{animation:fxpop .7s cubic-bezier(.2,1.6,.4,1) both}
.momfx{background:#fff;color:#11211a;border-radius:18px;padding:18px;text-align:left;animation:fxpop .5s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.momfx .k{font:700 12px Inter,sans-serif;letter-spacing:.06em;color:#8a6a00}
.momfx .n{font:700 34px/1.05 "Barlow Condensed",sans-serif;margin:2px 0}
.momfx .l{font-size:15px;color:#3a4a42}
.momfx .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;border-top:1px solid #e3e8e2;padding-top:12px}
.awards .mom{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:4px 0 12px;border-bottom:1px solid var(--line)}
.awards .medal{width:52px;height:52px}
.awards .k{font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.awards .n{font:700 26px/1.05 "Barlow Condensed",sans-serif}
.awards .l{font-size:14px;color:var(--mute)}
.awards .pts{font-size:12px;color:var(--mute);margin-top:4px}
.awards .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding-top:12px}
.awards .row2 b{display:block;font:700 20px/1.1 "Barlow Condensed",sans-serif}
.fxtog{min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:600;margin-left:8px}
@media (prefers-reduced-motion:reduce){#fx *,.fxtoast{animation-duration:.01s!important;animation-delay:0s!important}.confetti{display:none}}
/* desi awards */
.mcap.one{font-size:clamp(26px,8.5vw,38px);padding:10px 14px 12px}
.awards .fun{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.funrow{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:baseline;padding:5px 0;font-size:14px}
.funrow span{font-size:11px;font-weight:700;letter-spacing:.04em;color:#8a5a00;background:light-dark(#fff4d6,#3a2f10);border-radius:6px;padding:2px 6px}
.funrow small{grid-column:2;color:var(--mute);font-size:12px}
.funfx{margin-top:12px;padding-top:10px;border-top:1px dashed #e3e8e2;font-size:14px;display:grid;gap:4px}
.funfx .k{font-size:11px}
.fldpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fldpick button{min-height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--key);font-weight:600;font-size:14px}
.fldpick button.on{background:var(--g1);color:#fff;border-color:var(--g1)}
/* saved team chips */
.sqchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 6px}
.sqchips span{font-size:12px;color:var(--mute);margin-right:2px}
.sqchips button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--g2);color:var(--g2);background:transparent;font-size:13px;font-weight:700}
.sqchips button.on{background:var(--g1);border-color:var(--g1);color:#fff}
.sqchips button:disabled{opacity:.35}
:root[data-theme=dark] .sqchips button:not(.on){color:#7fc9a2;border-color:#7fc9a2}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .sqchips button:not(.on){color:#7fc9a2;border-color:#7fc9a2}}
/* captain row */
.caprow{display:flex;gap:6px;align-items:center;margin-top:6px}
.caprow .pn{flex:none;width:24px;text-align:right;font:600 16px "Barlow Condensed",sans-serif;color:var(--mute)}
.capbox{flex:1;min-height:42px;display:flex;align-items:center;gap:8px;padding:0 10px;border:1px dashed var(--g2);border-radius:10px;font-weight:600}
.capbox small{color:var(--mute);font-weight:400;font-size:12px;margin-left:auto}
.cbadge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:6px;background:#f2b705;color:#3a2a00;font:700 12px/1 Inter,sans-serif;vertical-align:middle}
/* modal */
#ov{position:fixed;inset:0;background:rgba(5,15,10,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
#ov[hidden]{display:none}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:540px;border-radius:18px;padding:18px 16px 16px;max-height:88vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:0 0 6px}
.note{color:var(--mute);font-size:14px;margin:0 0 10px}
.grid{display:grid;gap:8px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--key);font-weight:600;padding:6px 10px;text-align:center}
.opt.num{font:700 26px "Barlow Condensed",sans-serif}
.opt small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow button{flex:none;padding:0 16px;border-radius:10px;background:var(--g1);color:#fff;font-weight:700}
/* scorecard */
.sc h3{font:700 22px/1.1 "Barlow Condensed",sans-serif;margin:0}
.sc .tot{color:var(--mute);font-size:14px;margin:2px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mute);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td .how{display:block;font-size:12px;color:var(--mute);white-space:normal}
.fow{font-size:13px;color:var(--mute);margin:8px 0}
.empty{color:var(--mute);font-size:14px}
@media(max-width:380px){.pad button{min-height:60px;font-size:26px}.row{grid-template-columns:minmax(0,1fr) 34px 34px 28px 28px 44px;font-size:14px}.row.bw{grid-template-columns:minmax(0,1fr) 34px 32px 28px 30px 30px}}

async function api(path,opt={}){
  const r=await fetch('/api/'+path,{...opt,cache:'no-store',headers:{'Content-Type':'application/json',...(PINV?{'X-Scorer-Pin':PINV}:{}),...(opt.headers||{})}});
  const ct=r.headers.get('content-type')||'';
  if(!ct.includes('application/json')){const e=new Error('No server here');e.status=404;e.noServer=true;throw e}
  const body=await r.json();if(!r.ok){const e=new Error(body.error||('HTTP '+r.status));e.status=r.status;throw e}
  serverSeen=true;return body;
}
function queueSync(){if(WATCH||!S)return;if(!S.id)S.id=newId();clearTimeout(syncT);syncT=setTimeout(doSync,700)}
async function doSync(){
  if(WATCH||!S||!S.id)return;

  setSync('saving');
  try{await api('matches/'+S.id,{method:'PUT',body:JSON.stringify({state:S})});setSync('ok')}
  catch(e){setSync(e.noServer?'':e.status===401?'pin':e.status?'err':'off')}

function setSync(v){syncSt=v;const el=$('sync');if(el)el.outerHTML=syncBadge();const sh=$('sharebtn');if(sh)sh.hidden=!serverSeen}

  return `<button id="sync" class="sync ${m?m[1]:''}" data-a="pinset" ${m&&!WATCH?'':'hidden'}>${m?m[0]:''}</button>`;

async function checkPin(v){

  try{await api('pin-check',{method:'POST'});pinModal('PIN accepted — matches will be saved to the server.',true);doSync()}
  catch(e){pinModal(e.status===401?'That PIN is not right.':e.noServer?'This address has no server — the PIN is only used on the OpenShift address.':'Could not reach the server. Try again when online.',false)}
}
function shareModal(){

}

function fillTeamList(){const d=$('tlist');if(d)d.innerHTML=TEAMS.map(t=>`<option value="${esc(t.name)}"></option>`).join('')}
function squadHints(){[['tA','plA','tB'],['tB','plB','tA']].forEach(([i,e,o])=>{const ed=$(e),inp=$(i);if(!ed||!inp)return;ed.querySelector('.sqchips')?.remove();

function rememberTeams(){

  const keep=k=>S.teams[k].pl.filter(n=>!/^Player \d+$/.test(n)&&!(S.cap&&S.cap[k]&&n.toLowerCase()===S.cap[k].toLowerCase()));

async function loadHist(){

function histView(){

  const wk=st.topWickets.map(p=>`<tr><td><b>${esc(p.name)}</b><span class="how">${esc(p.team)}</span></td><td>${esc(p.bowling.overs)}</td><td><b>${p.bowling.wkts}</b></td><td>${esc(p.bowling.best)}</td><td>${p.bowling.econ??'–'}</td><td>${p.bowling.wides}/${p.bowling.noballs}</td></tr>`).join('');
  const tm=st.teams.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${t.played}</td><td>${t.won}</td><td>${t.lost}</td><td>${t.tied}</td></tr>`).join('');
  const list=ms.map(m=>`<div class="mrow"><div><b>${esc(m.teams.join(' v '))}</b>${m.status==='play'?'<span class="tag">LIVE</span>':''}<small>${d(m.updated_at)} · ${m.innings.map(x=>`${esc(x.team)} ${x.runs}/${x.wk}`).join(' · ')}</small><small>${esc(m.result||'In progress')}</small>${m.mom?`<small>Man of the Match: <b>${esc(m.mom.name)}</b> · ${esc(m.mom.line)}</small>`:''}</div><a href="?watch=${esc(m.id)}">View</a></div>`).join('');
  const mom=(st.topMom||[]).map(p=>`<tr><td><b>${esc(p.name)}</b><span class="how">${esc(p.team)}</span></td><td><b>${p.awards}</b></td></tr>`).join('');
  return `<section class="card sc"><h3>Top run-scorers</h3><div class="tot">${pl(st.matches,'finished match')} this season</div>

   ${mom?`<section class="card sc"><h3>Most Man of the Match awards</h3><div class="scroll"><table><thead><tr><th>Player</th><th>Awards</th></tr></thead><tbody>${mom}</tbody></table></div></section>`:''}
   <section class="card sc"><h3>Top wicket-takers</h3>
     ${wk?`<div class="scroll"><table><thead><tr><th>Bowler</th><th>O</th><th>W</th><th>Best</th><th>Econ</th><th>Wd/Nb</th></tr></thead><tbody>${wk}</tbody></table></div>`:'<p class="empty">No bowling figures yet.</p>'}</section>
   ${tm?`<section class="card sc"><h3>Teams</h3><div class="scroll"><table><thead><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th></tr></thead><tbody>${tm}</tbody></table></div></section>`:''}
   <section class="card sc"><h3>Matches</h3>${list||'<p class="empty">No matches saved yet.</p>'}</section>
   <section class="card sc"><h3>Backup</h3><p class="note">The free sandbox is reset every 30 days — download a backup before it ends, then restore it on the new one.</p>
     <div class="btnrow"><a href="/api/export" download>Download backup</a><button data-a="restore">Restore backup</button></div>

async function restore(file){
  const m=$('restoremsg');if(!PINV){m.className='msg bad';m.textContent='Set the scorer PIN first (tap the PIN badge on the Live screen).';return}
  try{const body=await file.text();JSON.parse(body);const r=await api('import',{method:'POST',body});m.className='msg ok';m.textContent=`Restored ${pl(r.matches,'match')}.`;setTimeout(()=>{hist=null;render()},1200)}
  catch(e){m.className='msg bad';m.textContent=e instanceof SyntaxError?'That file is not a backup file.':e.status===401?'Wrong scorer PIN.':e.message}
}
// Match awards: Man of the Match, best batter, best bowler.
// The same function is copied into index.html, so the app and the server always agree.
// Contribution points:
//   Batting : 1/run, +1 per four, +2 per six, strike-rate bonus (−6..+10 once 6+ balls faced),
//             +6 for 25+, +15 for 50+, −4 for a duck
//   Bowling : 20/wicket, +10 per maiden, economy vs match run rate ×3 (−10..+15 once 1+ over),
//             +10 for 3+ wickets, −1 per wide/no-ball
//   Fielding: 8 per catch or run-out (when the fielder's name was entered)
//   Winning team: +5
// Fun (desi) awards:
//   Daanveer    : bowler who gave away the most runs (at least 2 bowlers used)
//   Anda club   : every batter out for 0 — "golden" if out on the first ball faced
//   Jaadu Haath : most catches + run-outs (needs the fielder picked when recording the wicket)
function matchAwards(st) {
  if (!st || !Array.isArray(st.inns) || !st.inns.length || !Array.isArray(st.teams)) return null;
  const P = new Map();
  const get = (n, team) => { const k = team + '|' + String(n).toLowerCase(); if (!P.has(k)) P.set(k, { name: n, team, bat: null, bowl: null, fld: 0, pb: 0, pw: 0, pf: 0, pv: 0 }); return P.get(k); };
  const anda = [];
  let tr = 0, tb = 0; for (const i of st.inns) { tr += i.runs | 0; tb += i.balls | 0; }
  const avgRate = tb ? tr * 6 / tb : 6;
  for (const i of st.inns) {
    const bt = st.teams[i.bat].name, wt = st.teams[i.bowl].name;
    for (const b of i.bats || []) {
      const p = get(b.n, bt), sr = b.b ? b.r * 100 / b.b : 0, out = !!b.out && !b.ret;
      let pts = (b.r | 0) + (b.f4 | 0) + 2 * (b.f6 | 0);
      if (b.b >= 6) pts += Math.max(-6, Math.min(10, (sr - 120) / 10));
      if (b.r >= 50) pts += 15; else if (b.r >= 25) pts += 6;
      if (out && !b.r) { pts -= 4; anda.push({ name: b.n, team: bt, golden: (b.b | 0) <= 1 }); }
      p.bat = { r: b.r | 0, b: b.b | 0, f4: b.f4 | 0, f6: b.f6 | 0, out }; p.pb += pts;
      if (b.fld) { const f = get(b.fld, wt); f.fld++; f.pf += 8; }
    }
    for (const w of i.bowls || []) {
      const p = get(w.n, wt), econ = w.balls ? w.r * 6 / w.balls : 0;
      let pts = (w.w | 0) * 20 + (w.md | 0) * 10 - ((w.wd | 0) + (w.nb | 0));
      if (w.balls >= 6) pts += Math.max(-10, Math.min(15, (avgRate - econ) * 3));
      if (w.w >= 3) pts += 10;
      p.bowl = { balls: w.balls | 0, r: w.r | 0, w: w.w | 0, md: w.md | 0 }; p.pw += pts;
    }
  }
  let win = null;
  if (st.phase === 'over' && st.inns.length === 2) {
    const [a, b] = st.inns;
    if (a.runs > b.runs) win = st.teams[a.bat].name; else if (b.runs > a.runs) win = st.teams[b.bat].name;
  }
  const list = [...P.values()];
  for (const p of list) { if (win && p.team === win) p.pv = 5; p.total = Math.round((p.pb + p.pw + p.pf + p.pv) * 10) / 10; }
  const ov = b => Math.floor(b / 6) + (b % 6 ? '.' + (b % 6) : '');
  const batLine = x => `${x.r}${x.out ? '' : '*'} (${x.b})` + (x.f4 || x.f6 ? ' · ' + [x.f4 ? x.f4 + '×4' : '', x.f6 ? x.f6 + '×6' : ''].filter(Boolean).join(' ') : '');
  const bowlLine = x => `${x.w}/${x.r} (${ov(x.balls)} ov)` + (x.md ? ` · ${x.md} maiden${x.md > 1 ? 's' : ''}` : '');
  const line = p => [p.bat && (p.bat.b || p.bat.out) ? batLine(p.bat) : '', p.bowl && p.bowl.balls ? bowlLine(p.bowl) : '', p.fld ? `${p.fld} catch/run-out${p.fld > 1 ? 's' : ''}` : ''].filter(Boolean).join(' & ');
  const pick = (arr, v, tie) => arr.slice().sort((x, y) => v(y) - v(x) || tie(y) - tie(x))[0] || null;
  const mom = pick(list.filter(p => line(p)), p => p.total, p => (p.bat ? p.bat.r : 0) + (p.bowl ? p.bowl.w * 20 : 0));
  const bb = pick(list.filter(p => p.bat && p.bat.b), p => p.pb, p => p.bat.r);
  const bw = pick(list.filter(p => p.bowl && p.bowl.balls), p => p.pw, p => p.bowl.w);
  const r1 = x => Math.round(x * 10) / 10;
  const bowlers = list.filter(p => p.bowl && p.bowl.balls);
  const daan = bowlers.length >= 2 ? pick(bowlers, p => p.bowl.r, p => p.bowl.r * 6 / p.bowl.balls) : null;
  const jaadu = pick(list.filter(p => p.fld), p => p.fld, p => p.total);
  return {
    winner: win,
    mom: mom && { name: mom.name, team: mom.team, points: mom.total, line: line(mom), parts: { batting: r1(mom.pb), bowling: r1(mom.pw), fielding: mom.pf, win: mom.pv } },
    bestBat: bb && { name: bb.name, team: bb.team, points: r1(bb.pb), line: batLine(bb.bat) },
    bestBowl: bw && { name: bw.name, team: bw.team, points: r1(bw.pw), line: bowlLine(bw.bowl) },
    daanveer: daan && daan.bowl.r > 0 ? { name: daan.name, team: daan.team, line: `${daan.bowl.r} runs in ${ov(daan.bowl.balls)} ov` } : null,
    andaClub: anda,
    jaaduHaath: jaadu ? { name: jaadu.name, team: jaadu.team, line: `${jaadu.fld} catch${jaadu.fld > 1 ? 'es' : ''}/run-out${jaadu.fld > 1 ? 's' : ''}` } : null,
  };
}

const fxQ=[];let fxBusy=false,fxTimer=null;
function fxPush(html,ms,cls){fxQ.push({html,ms,cls});if(!fxBusy)fxNext()}
function fxNext(){
  const el=$('fx');if(!el)return;clearTimeout(fxTimer);const it=fxQ.shift();
  if(!it){fxBusy=false;el.className='';el.innerHTML='';return}
  fxBusy=true;el.className='on '+(it.cls||'');
  el.innerHTML=`<div class="back"></div><div class="fxbox">${it.html}<p class="mtag">Tap to skip</p></div>`;
  fxTimer=setTimeout(fxNext,it.ms);
}
function fxClear(){fxQ.length=0;fxNext()}

function memeHtml(type,e){
  const set=MEMESETS[LG()]||MEMESETS.en;
  let list=set[type]||set.out;
  if(type==='out'&&set[e.w])list=set[e.w].concat(set.out);
  const m=list[(e.seq||0)%list.length],bat=type==='six'||type==='four'?e.bat:e.outName;
  const fill=t=>t.replace(/\{BAT\}/g,bat||'Batter').replace(/\{BOWLER\}/g,e.bowl||'Bowler').replace(/\{B\}/g,e.outB|0).replace(/\{R\}/g,e.outR|0);
  return `<div class="meme"><svg viewBox="0 0 400 260" aria-hidden="true">${MEMEART[m[2]]}</svg>${m[1]?`<div class="mcap t">${esc(fill(m[0]))}</div><div class="mcap b">${esc(fill(m[1]))}</div>`:`<div class="mcap b one">${esc(fill(m[0]))}</div>`}</div>`;
}
function celebrate(e){
  if(!FXON||!e)return;
  const r=e.r|0,t=TX();

    const ro=e.w==='runout',duck=!e.outR,gold=duck&&(e.outB|0)<=1;
    fxPush(`${stumpsArt()}<div class="fxword">${ro?t.runout:t.out}</div><p class="fxsub">${esc(e.outName||'')} ${esc(e.outText||'')} · ${e.outR|0} (${e.outB|0})</p>`,1700,'fx-out');
    fxPush(memeHtml(ro?'runout':gold?'golden':duck?'duck':'out',e),3400,'fx-meme');
    return;
  }
  if(e.bd===6){fxPush(`${sixArt()}<div class="fxword">${t.six}</div><p class="fxsub">${esc(t.by(e.bat,e.bowl))}</p>`,1500,'fx-six');fxPush(memeHtml('six',e),3200,'fx-meme');}
  else if(e.bd===4){fxPush(`${fourArt()}<div class="fxword">${t.four}</div><p class="fxsub">${esc(t.by(e.bat,e.bowl))}</p>`,1300,'fx-four');fxPush(memeHtml('four',e),3000,'fx-meme');}
  if(e.k==='wd')toast(t.wide(r));
  else if(e.k==='nb')toast(t.nb(e.bd,r));
  else if(e.k==='b')toast(t.bye(r));
  else if(e.k==='lb')toast(t.lb(r));
}
function confetti(){

  for(let k=0;k<70;k++){const d=document.createElement('i');d.className='confetti';
    d.style.cssText=`left:${Math.random()*100}vw;background:${cols[k%cols.length]};--sx:${(Math.random()*160-80).toFixed(0)}px;--sr:${(Math.random()*900-450).toFixed(0)}deg;animation-duration:${(2.4+Math.random()*2).toFixed(2)}s;animation-delay:${(Math.random()*.8).toFixed(2)}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}
}
function funLines(a,t){

function applyLive(d){
  const prev=S;S=d.state;watchAt=new Date();watchErr='';
  if(!M||M==='p')render();
  if(prev){
    if(S.last&&(!prev.last||S.last.seq>prev.last.seq))celebrate(S.last);

let es=null,esOk=false;
function startWatch(){
  if('EventSource' in window&&!es){
    try{
      es=new EventSource('/api/matches/'+WATCH+'/events');
      es.onmessage=e=>{esOk=true;try{applyLive(JSON.parse(e.data))}catch(err){}};
      es.onerror=()=>{esOk=false;if(es&&es.readyState===2){es=null;setTimeout(startWatch,5000)}};
    }catch(e){es=null}
  }
  pollWatch();
}
async function pollWatch(){

/* ---------- scoring logic ---------- */
function ball(ev){
  const i=I();if(S.phase!=='play'||i.s==null||i.n==null||i.bw==null)return;
  snap();

  let tot=0,charge=0,lab='';
  if(k==='run'){tot=r;charge=r;st.r+=r;st.b++;lab=r?String(r):'•'}
  else if(k==='wd'){tot=1+r;charge=tot;i.ex.wd+=tot;bw.wd=(bw.wd||0)+1;lab=r?'Wd+'+r:'Wd'}
  else if(k==='nb'){tot=1+r;charge=tot;i.ex.nb++;bw.nb=(bw.nb||0)+1;st.r+=r;st.b++;lab=r?'Nb+'+r:'Nb'}
  else{tot=r;i.ex[k]+=r;st.b++;lab=r+(k==='b'?'B':'LB')}
  const boundary=(k==='run'||k==='nb')&&(r===4||r===6);
  if(boundary){r===4?st.f4++:st.f6++}
  i.runs+=tot;bw.r+=charge;bw.ovR+=charge;i.pr+=tot;
  if(legal){i.balls++;bw.balls++;bw.ob++}
  if(k!=='wd')i.pb++;
  let outIdx=null,outRec=null;if(ev.w)outIdx=ev.w.who==='n'?i.n:i.s;
  if(r%2===1)[i.s,i.n]=[i.n,i.s];
  if(ev.w){
    const o=i.bats[outIdx],t=ev.w.t,b=bw.n,f=ev.w.f;
    o.out={bowled:'b '+b,caught:(f?'c '+f+' ':'c ')+'b '+b,lbw:'lbw b '+b,runout:'run out'+(f?' ('+f+')':''),stumped:'st b '+b,hitwicket:'hit wicket b '+b}[t];
    if(f&&(t==='caught'||t==='runout'))o.fld=f;
    outRec=o;
    if(t!=='runout')bw.w++;
    i.wk++;i.fow.push({s:i.runs,w:i.wk,n:o.n,o:ov(i.balls)});
    if(i.s===outIdx)i.s=null;else i.n=null;
    i.pr=0;i.pb=0;lab=lab==='•'?'W':lab+' W';
  }
  i.fh=k==='nb'?true:k==='wd'?i.fh:false;
  i.over.push({l:lab,c:ev.w?'w':boundary?'b':legal?'':'x'});
  if(legal&&i.balls%6===0){
    if(bw.ob===6&&bw.ovR===0)bw.md++;
    i.overs.push(i.over);i.over=[];[i.s,i.n]=[i.n,i.s];i.lastBw=i.bw;i.bw=null;
  }

  const wasOver=S.phase==='over';
  checkEnd();save();render();
  celebrate(S.last);if(!wasOver&&S.phase==='over')celebrateWin(S);

}
function checkEnd(){

function endInn(){

function resultText(){

/* Bowling quota: max S.maxo overs each; if S.bonus, exactly one bowler per innings may bowl one more */
function canBowl(i,n){

    if(x<0){i.bowls.push({n:name,balls:0,r:0,w:0,md:0,ovR:0,ob:0,wd:0,nb:0});x=i.bowls.length-1}

function summary(){

  const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadCtrl&&!reloaded){reloaded=true;location.reload()}});
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{})})}).catch(()=>{}));
}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();instP=e;render()});
window.addEventListener('appinstalled',()=>{instP=null;render()});
let lock=null;
const keepAwake=async()=>{try{if('wakeLock' in navigator&&!lock&&document.visibilityState==='visible'){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}catch(e){}};
document.addEventListener('click',keepAwake);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){keepAwake();if(WATCH)pollWatch()}});
$('fx').addEventListener('click',()=>fxNext());
window.addEventListener('online',()=>doSync());
setInterval(()=>{if(['off','err','saving'].includes(syncSt))doSync()},30000);
if(S&&!S.id&&!WATCH){S.id=newId();save()}
// A finished match stays up for 20 minutes (to show the result and awards), then the app opens on a fresh setup
let lastDone=null;try{lastDone=JSON.parse(localStorage.getItem('weekend-cricket-v1-last')||'null')}catch(e){}
if(!WATCH&&S&&S.phase==='over'&&(!S.finishedAt||Date.now()-S.finishedAt>20*60*1000)){
  lastDone={id:S.id,result:S.result,score:S.inns.map(x=>`${S.teams[x.bat].name} ${x.runs}/${x.wk}`).join(' · ')};
  try{localStorage.setItem('weekend-cricket-v1-last',JSON.stringify(lastDone))}catch(e){}
  rememberTeams();S=null;H=[];try{localStorage.removeItem(K)}catch(e){}tab='live';
}
render();
if(WATCH)startWatch();else if(S)doSync();else api('healthz').catch(()=>{});
}
